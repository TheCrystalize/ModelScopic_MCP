[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelscopic"
version = "0.0.1"
description = "MCP server for VSCode-driven app development with vision + input."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "websockets>=12.0",
  "mss>=9.0",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]
build = [
  "pyinstaller>=6.0",
]
# Input injection deps land in M3:
# input = ["pydirectinput>=1.0.4"]

[project.scripts]
modelscopic = "modelscopic.__main__:main"
# Convenience aliases. The unified `modelscopic` command will choose the right
# mode based on stdin (TTY -> REPL, pipe -> MCP). These force a specific mode:
modelscopic-repl = "modelscopic.cli:main"
modelscopic-mcp  = "modelscopic.server:_sync_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelscopic*"]

[tool.ruff]
line-length = 100
target-version = "py311"
